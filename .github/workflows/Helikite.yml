name: Build Flet Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet numpy

      - name: Ensure Main Entrypoint File
        run: |
          if [ -f "HelikiteDesigner_V1.5.py" ]; then
            cp HelikiteDesigner_V1.5.py main.py
          fi

      - name: Build Android APK
        run: |
          flet build apk --no-interactive --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelikiteDesigner-APK
          path: build/apk/app-release.apk
